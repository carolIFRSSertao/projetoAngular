<div class="flex flex-col gap-6">
    <app-title main="Aplicação Angular com tarefa"
        subtitulo="Exemplo de lista de tarefas">
    </app-title>
<p>Bem-vindo a lista de tarefas</p>
<div>
    <input type="text" placeholder="Adicione o título da tarefa"
    class="input w-full"
    (keyup.enter)="addTarefa($event,$event.target)"/>
</div>
<div class="flex flex-col gap-2">
    @for (item of tarefas.items(); track item.id){
        <div class="p-3 border border-zinc-800 
            rounded-leg flex items-center gap-4">
           <span [class.line-through]="item.completed" class="flex-1"> {{ item.title }}</span>
            <span
            [class-bg-green-700]="item.completed"
            [class-bg-yellow-700]="!item.completed"
            class="px-4- py-1 rounded-full text-sm text-white">
            {{item.completed ? 'Concluído' : 'Pendente'}}
            </span>
            <button (click)="tarefas.toggle(item.id)"
            class="btn btn-primary mr-1">
            {{item.completed ? 'Marcar como Pendente':'Marcar como Concluído'}}
            </button>
            <button (click)="tarefas.remove(item.id)" 
            class="btn btn-danger mr-1">Deletar</button>
        </div>
    }
</div>
</div>
